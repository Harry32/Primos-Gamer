{% extends "base.html" %}

{% block title %} - Excluir {{categoria.nome}} {% endblock %}

{% block content %}
    <form action="{% url 'delete' categoria.id %}" method="post">
        {% csrf_token %}
        <h3>Deseja mesmo apagar a categoria {{categoria.nome}}?<h3>
        <br/>
        <input type="submit" value="Excluir">
        <input type="button" onclick="location.href='{% url 'list' %}'" value="Cancelar">
    </form>
{% endblock %}
